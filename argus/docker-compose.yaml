# =============================================================================
# Argus -- local stack
#
#   docker compose up -d --build        start datastores and services
#   docker compose run --rm tools bootstrap   migrate + seed (first run)
#
# Every service reads the same optional .env (copy .env.example). Without one,
# the defaults in argus_core.settings match the hostnames below, so the stack
# starts with no configuration at all -- only the Analyst needs an LLM key.
#
# Ports are bound to 127.0.0.1 so nothing here is reachable from the network.
# =============================================================================

x-env: &env
  env_file:
    - path: .env
      required: false

# Config is baked into each image at build time (see the service Dockerfiles),
# not bind-mounted: the image IS the deployable unit, and a config change is a
# rebuild -- seconds, thanks to layer caching.
x-service: &service
  <<: *env
  restart: unless-stopped

services:
  # --- datastores -------------------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One server, three databases (pulse, sentry, analyst) -- the migration
  # runner creates the ones that do not exist yet. The analytics store
  # and the knowledge store are deliberately different engines.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: pulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The knowledge base: Postgres with pgvector, a separate instance so a heavy
  # re-embed never competes with the KPI and alert databases.
  codex-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${CODEX_USER:-argus}
      POSTGRES_PASSWORD: ${CODEX_PASSWORD:-dev_password}
      POSTGRES_DB: codex
    volumes:
      - codex-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d codex"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- services ---------------------------------------------------------------

  prism:
    <<: *service
    build:
      context: .
      dockerfile: services/prism/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  pulse:
    <<: *service
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      prism: { condition: service_healthy }
      postgres: { condition: service_healthy }

  sentry:
    <<: *service
    build:
      context: .
      dockerfile: services/sentry/Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      prism: { condition: service_healthy }
      postgres: { condition: service_healthy }

  codex:
    <<: *service
    build:
      context: .
      dockerfile: services/codex/Dockerfile
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      codex-db: { condition: service_healthy }

  # The only service that needs a secret: the LLM key, from .env.
  analyst:
    <<: *service
    build:
      context: .
      dockerfile: services/analyst/Dockerfile
    ports:
      - "127.0.0.1:8003:8000"
    # Started, not healthy: the analyst calls these per request, so it should
    # come up even while a fresh stack is still waiting for its migrations.
    depends_on:
      prism: { condition: service_started }
      pulse: { condition: service_started }
      sentry: { condition: service_started }
      codex: { condition: service_started }

  deck:
    <<: *service
    build:
      context: .
      dockerfile: services/deck/Dockerfile
    ports:
      - "127.0.0.1:3000:8000"
    depends_on:
      pulse: { condition: service_started }
      sentry: { condition: service_started }
      analyst: { condition: service_started }

  # --- one-off tasks ------------------------------------------------------------
  # docker compose run --rm tools bootstrap | migrate | seed | compute | accept | status

  tools:
    <<: *env
    build:
      context: .
      dockerfile: datamodel/Dockerfile
    profiles: ["tools"]
    # The seeder writes the fault manifest to a shared volume, so the
    # acceptance test reads exactly which faults this run planted.
    environment:
      ARGUS_MANIFEST: /state/fault-manifest.json
    volumes:
      - argus-state:/state
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      codex-db: { condition: service_healthy }

volumes:
  argus-state:
  clickhouse-data:
  postgres-data:
  codex-data:
