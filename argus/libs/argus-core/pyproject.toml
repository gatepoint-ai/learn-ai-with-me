[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "argus_core"
version = "0.1.0"
description = "Shared core for the argus services: settings, datastore clients, SQL compiler, config schemas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "clickhouse-connect>=0.8",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.1",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["argus_core*"]
